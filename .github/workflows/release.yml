name: Release & Publish to npm

# Publishes a new version when a `v*` tag is pushed:
#
#   1. Verifies the tag matches package.json's version
#   2. Runs the full test suite
#   3. Publishes to npm with provenance
#   4. Creates the GitHub Release with auto-generated notes
#
# One-time setup:
#   - Repository secret NPM_TOKEN: an npm Granular Access Token with
#     read/write on the package (npmjs.com -> Access Tokens)
#   - Publishing settings must allow publishing without 2FA for the token
#
# Usage: git tag v2.4.0 && git push origin v2.4.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "✅ Releasing responsive-scale-mixins@$PKG_VERSION"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run test suite
        run: npm test

      - name: Validate package tarball
        run: |
          npm pack --dry-run > pack-output.txt
          if grep -q "AGENTS.md\|test/\|docs/" pack-output.txt; then
            echo "❌ Dev files leaked into the tarball"
            exit 1
          fi
          echo "✅ Tarball contains only the distributed files"

      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "responsive-scale-mixins ${GITHUB_REF_NAME#v}"
