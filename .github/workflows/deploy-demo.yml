name: Deploy Demo to GitHub Pages

# Publishes the live demo (docs/demo/) to GitHub Pages on every push to main.
#
# One-time setup in the GitHub repository settings:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Stage the package for Sass resolution
        # The demo compiles `@use "responsive-scale-mixins"` exactly like a
        # consumer project. The package IS index.scss, so staging a copy into
        # node_modules reproduces bundler resolution faithfully.
        run: |
          mkdir -p node_modules/responsive-scale-mixins
          cp index.scss node_modules/responsive-scale-mixins/index.scss

      - name: Compile demo stylesheet
        run: npx sass --load-path=node_modules docs/demo/demo.scss docs/demo/demo.css

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/demo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
